<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>管理画面ログイン</title>

  <!-- Google Identity Services -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>

</head>

<body>

  <div class="login-box">

    <h1>管理画面ログイン</h1>

    <div
      id="g_id_onload"
      data-client_id="593983773789-d17k34e1j2pkcsin1pfjvbutvd47olip.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
    ></div>

    <div
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular"
      data-logo_alignment="left"
    ></div>

    <p id="message"></p>

  </div>

  <script src="./login.js"></script>

</body>
</html>
